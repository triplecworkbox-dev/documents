<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitale Wellness</title>
<style>
:root{
 --green:#176b48;--forest:#164b39;--leaf:#378c63;--sage:#b9d5b8;--pale:#e5eee0;
 --cream:#fbf8f1;--ivory:#f5f0e5;--soft:#f0f5ec;--amber:#e6ad48;--coral:#d85c5c;
 --text:#24342c;--muted:#777c78;--white:#fff;--shadow:0 12px 34px rgba(35,72,50,.10);
 --radius:22px;
}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Inter,Manrope,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,248,241,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(22,75,57,.08)}
.top-inner{max-width:1240px;margin:auto;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-mark{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#a9c9a5,#3c8a62);display:flex;align-items:center;justify-content:center;color:white;font-size:23px}
.brand-text{line-height:1.05}.brand-text strong{letter-spacing:2px;font-size:17px}.brand-text small{letter-spacing:3px;font-size:10px;display:block;margin-top:4px}
.nav{display:flex;gap:8px;align-items:center}.nav button{background:transparent;color:var(--text);padding:10px 13px;border-radius:13px;font-weight:650}.nav button:hover,.nav button.active{background:var(--pale);color:var(--green)}
.icon-btn{background:var(--soft);width:40px;height:40px;border-radius:50%;font-size:18px;color:var(--forest)}
main{width:100%;max-width:1240px;margin:0 auto;padding:28px 24px 90px}
.page{animation:fade .22s ease}@keyframes fade{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,4vw,48px);line-height:1.1;margin:0 0 14px;letter-spacing:-1.3px}h2{font-size:26px;margin:0 0 14px;letter-spacing:-.5px}h3{font-size:18px;margin:0 0 8px}p{line-height:1.55;margin:0 0 12px;color:var(--muted)}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--leaf);text-transform:uppercase;margin-bottom:10px}
.btn{padding:13px 19px;border-radius:999px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.primary{background:var(--green);color:white;box-shadow:0 7px 18px rgba(23,107,72,.18)}.secondary{background:var(--pale);color:var(--forest)}.outline{background:white;color:var(--green);border:1px solid #d5e4d5}.danger{background:#b74343;color:white}
.card{background:white;border:1px solid rgba(22,75,57,.07);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:stretch;margin-bottom:30px}

sition:top left;background-size:110px auto;padding:30px 8px 30px 0;display:flex;flex-direction:column;justify-content:center}
.hero-image{min-height:350px;border-radius:30px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,rgba(23,107,72,.05),transparent)}
.hero-badge{position:absolute;bottom:20px;left:20px;background:rgba(255,255,255,.9);border-radius:18px;padding:14px 18px;max-width:260px;z-index:2}
.hero-badge strong{display:block;color:var(--green);margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 30px}
.tile{background:var(--soft);border-radius:20px;padding:18px;min-height:115px;cursor:pointer;transition:.2s;border:1px solid transparent}.tile:hover{border-color:var(--sage);transform:translateY(-2px)}
.tile-icon{font-size:25px;margin-bottom:12px}.tile strong{display:block}.tile small{color:var(--muted);display:block;margin-top:5px}
.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.journey-item{background:white;border-radius:20px;padding:18px 14px;border:1px solid rgba(22,75,57,.06)}
.journey-item .icon{width:43px;height:43px;border-radius:50%;background:var(--pale);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.journey-item strong{display:block;margin-bottom:6px}.journey-item small{color:var(--muted);line-height:1.4}
.heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.search{width:min(100%,420px);background:white;border:1px solid #dce6da;border-radius:999px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.search input{border:0;outline:0;background:transparent;width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border-radius:999px;padding:9px 15px;background:white;border:1px solid #e2e8df;color:var(--text);font-weight:700}.chip.active{background:var(--green);color:white;border-color:var(--green)}
.therapists{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.therapist-card{cursor:pointer;display:flex;gap:15px;align-items:center}.avatar{width:84px;height:84px;flex-shrink:0;border-radius:22px;background-size:cover;background-position:center}
.rating{color:#d5a43a;font-weight:800}.muted{color:var(--muted)}.tag{display:inline-block;background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;margin:3px 3px 0 0;color:var(--forest)}
.profile{display:grid;grid-template-columns:340px 1fr;gap:24px}.profile-image{width:100%;height:320px;object-fit:cover;border-radius:25px}
.tabs{display:flex;gap:6px;border-bottom:1px solid #e4e9e0;margin:22px 0}.tab{background:transparent;padding:12px 16px;color:var(--muted);font-weight:750}.tab.active{color:var(--green);border-bottom:3px solid var(--green)}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0 22px}.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:13px}.step span{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e5e9e3}.step.active{color:var(--green)}.step.active span{background:var(--green);color:white}.line{height:1px;background:#d9e4d8;flex:1}
.booking-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.calendar{background:white;border-radius:20px;padding:18px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cal-head button{background:var(--soft);border-radius:50%;width:36px;height:36px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week div{padding:8px;color:var(--muted);font-size:12px;font-weight:700}.day{padding:12px 4px;border-radius:12px;background:transparent;color:var(--text);min-height:44px}.day.available{background:var(--soft)}.day.selected{background:var(--green);color:white}.day.disabled{color:#c5c9c4;cursor:not-allowed}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.time{background:var(--soft);border-radius:12px;padding:12px;font-weight:750}.time.active{background:var(--green);color:white}
.summary-list{list-style:none;padding:0;margin:0}.summary-list li{padding:12px 0;border-bottom:1px solid #edf0eb;display:flex;justify-content:space-between;gap:10px}
.payment-option{display:flex;gap:13px;padding:16px;border:1px solid #e3e9e0;border-radius:18px;margin-bottom:12px;cursor:pointer;align-items:flex-start}.payment-option.active{border:2px solid var(--green);background:var(--soft)}.radio{width:22px;height:22px;border:2px solid #b8c5b8;border-radius:50%;margin-top:2px;flex-shrink:0}.payment-option.active .radio{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px white}
.input{width:100%;padding:13px 15px;border:1px solid #dce6da;border-radius:14px;background:white;outline:0}.input:focus{border-color:var(--leaf)}.row{display:flex;gap:10px}.row>*{flex:1}
.video-wrap{background:#19382d;border-radius:25px;min-height:440px;position:relative;overflow:hidden;color:white;display:grid;place-items:center;background-image:linear-gradient(135deg,#245541,#183a2d)}
.video-main{width:100%;height:100%;min-height:440px;display:grid;place-items:center;text-align:center}.video-main img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.3)}
.video-thumb{position:absolute;right:18px;top:18px;width:125px;height:110px;border-radius:18px;background:#c5d9c3;color:var(--forest);display:grid;place-items:center;font-size:30px}
.video-controls{display:flex;justify-content:center;gap:12px;padding:20px}.control{width:58px;height:58px;border-radius:50%;background:white;color:var(--forest);font-size:20px}.control.active{background:#d9e9d6}.control.end{background:#d54b4b;color:white}
.chat-panel{background:white;border-radius:20px;padding:16px}.chat-messages{height:180px;overflow:auto;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:10px}.msg{padding:9px 12px;background:white;border-radius:14px;margin:7px 0;max-width:80%;font-size:14px}.msg.mine{margin-left:auto;background:#dcebd9}
.progress{display:flex;gap:8px;margin:18px 0}.progress-step{flex:1;text-align:center}.progress-step .dot{width:32px;height:32px;border-radius:50%;background:var(--pale);color:var(--green);display:grid;place-items:center;margin:auto auto 8px;font-weight:800}.progress-step.done .dot{background:var(--green);color:white}.progress-step small{color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.dash-card{cursor:pointer}.dash-card:hover{transform:translateY(-2px)}.dash-card .big-icon{font-size:26px;background:var(--soft);width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.mood{border-radius:22px;padding:22px 14px;text-align:center;background:white;border:2px solid transparent;cursor:pointer}.mood .face{font-size:44px;display:block;margin-bottom:8px}.mood.good{background:#e5f3e1}.mood.okay{background:#fff3d8}.mood.struggling{background:#fce5e2}.mood.active{border-color:var(--green);box-shadow:0 8px 22px rgba(23,107,72,.12)}
.response-panel{border-radius:24px;padding:25px;background:linear-gradient(135deg,#e7f2e4,#f9f6ed)}.history-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e9eee7}
.modal-backdrop{position:fixed;inset:0;background:rgba(22,45,33,.42);z-index:50;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:24px;padding:25px;max-width:450px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:85px;right:20px;background:var(--forest);color:white;padding:14px 20px;border-radius:15px;z-index:60;box-shadow:var(--shadow);animation:fade .2s}
.mobile-nav{display:none}
footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.empty{padding:35px;text-align:center}
@media(max-width:950px){.hero{grid-template-columns:1fr 1fr}.journey{grid-template-columns:repeat(3,1fr)}.therapists{grid-template-columns:repeat(2,1fr)}.profile{grid-template-columns:280px 1fr}.booking-layout{grid-template-columns:1fr}.nav button{padding:9px}}
@media(max-width:650px){
 .top-inner{padding:12px 15px}.nav{display:none}.brand-text strong{font-size:15px}
 main{padding:18px 15px 100px}.hero{grid-template-columns:1fr;gap:10px}.hero-copy{padding:14px 0}.hero-image{min-height:260px}
 .tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:15px;min-height:100px}.journey{grid-template-columns:1fr 1fr}
 .heading-row{align-items:stretch;flex-direction:column}.therapists{grid-template-columns:1fr}.therapist-card{padding:16px}
 .profile{grid-template-columns:1fr}.profile-image{height:280px}.booking-layout{grid-template-columns:1fr}.times{grid-template-columns:repeat(2,1fr)}
 .dashboard-grid{grid-template-columns:1fr}.moods{gap:8px}.mood{padding:16px 8px}.mood .face{font-size:36px}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #e7ece5;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}
 .mobile-nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700}.mobile-nav button.active{color:var(--green)}.mobile-nav span{font-size:20px}
 .video-wrap,.video-main{min-height:360px}.video-thumb{width:90px;height:80px}.video-controls{gap:8px}.control{width:50px;height:50px}
 .stepper{gap:6px}.step{font-size:11px}.step span{width:26px;height:26px}
}

function discover(){let filtered=therapists.filter(t=>(filter==='All'||t.specialties.includes(filter))&&(`${t.name} ${t.title} ${t.specialties.join(' ')}`.toLowerCase().includes(query.toLowerCase())));return `<div class="page">${header('Psychology & Therapy','Professional, compassionate support for your mental and emotional well-being.')}<div class="search">⌕ <input placeholder="Search by concern, speciality..." value="${query.replace(/"/g,'&quot;')}" oninput="query=this.value;render()"></div><div class="filters">${['All','Anxiety','ADHD','Stress'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="therapists">${filtered.map(t=>`<div class="card therapist-card" onclick="selectedTherapist=therapists.find(x=>x.id==='${t.id}');profileTab='About';go('profile')"><div class="avatar" style="background-image:url('${t.image}')"></div><div><strong>${t.name}</strong><div class="muted" style="margin:5px 0">${t.title}</div><div class="rating">★ ${t.rating} <span class="muted">(${t.reviews} reviews)</span></div><div>${t.specialties.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div><div style="margin-left:auto;font-size:20px">›</div></div>`).join('')}</div>${filtered.length===0?`<div class="card empty">No therapists match that search. Try another speciality.</div>`:''}</div>`}
function profile(){let t=selectedTherapist;return `<div class="page"><button class="btn secondary" onclick="go('discover')">← Back to professionals</button><div class="profile" style="margin-top:20px"><div><img class="profile-image" src="${t.image}"><div class="card" style="margin-top:14px"><div class="rating">★ ${t.rating} <span class="muted">(${t.reviews} reviews)</span></div><p style="margin-top:10px">✓ ${t.registered}<br>✓ ${t.experience} experience</p><h2>${money(t.price)} <span class="muted" style="font-size:14px">/ session</span></h2><button class="btn primary" style="width:100%" onclick="go('booking')">View Availability →</button></div></div><div class="card"><div class="kicker">Professional profile</div><h1 style="font-size:34px">${t.name}</h1><p>${t.title}</p><div class="tabs">${['About','Specialities','Reviews'].map(x=>`<button class="tab ${profileTab===x?'active':''}" onclick="profileTab='${x}';render()">${x}</button>`).join('')}</div>${profileTab==='About'?`<p>${t.bio}</p>`:profileTab==='Specialities'?`<h3>Areas of support</h3>${t.specialties.map(s=>`<span class="tag">${s}</span>`).join('')}<p style="margin-top:18px">Sessions are tailored to your needs and goals.</p>`:`<h3>Client feedback</h3><div class="rating">★ ${t.rating} overall</div><p>${t.reviews} reviews. Clients appreciate the supportive, collaborative approach.</p><div class="card" style="background:var(--soft)">“A warm and welcoming space. I felt listened to and supported.”<br><small class="muted">— Sample prototype review</small></div>`}</div></div></div>`}
function bookingScreen(){let year=date.getFullYear(),month=date.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){let dt=new Date(year,month,d),key=dt.toISOString().slice(0,10),past=dt<new Date(new Date().setHours(0,0,0,0)),avail=!past&&d%4!==0;cells+=`<button class="day ${past?'disabled':avail?'available':''} ${selectedDate===key?'selected':''}" ${avail?`onclick="selectedDate='${key}';selectedTime=null;render()"`:'disabled'}>${d}</button>`}return `<div class="page">${header('Book a Telehealth Session','Choose a time that works for you.')}<div class="stepper">${['Date & Time','Confirm','Pay'].map((x,i)=>`<div class="step ${i===0?'active':''}"><span>${i+1}</span>${x}</div>${i<2?'<div class="line"></div>':''}`).join('')}</div><div class="booking-layout"><div class="card calendar"><div class="cal-head"><button onclick="date=new Date(date.getFullYear(),date.getMonth()-1,1);render()">‹</button><strong>${date.toLocaleString('en',{month:'long',year:'numeric'})}</strong><button onclick="date=new Date(date.getFullYear(),date.getMonth()+1,1);render()">›</button></div><div class="week">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div><div style="margin-top:22px"><strong>Select a Time</strong><div class="times">${(selectedTherapist.availability||['09:00','10:30','14:00','15:30','16:30']).map(x=>`<button class="time ${selectedTime===x?'active':''}" onclick="selectedTime='${x}';render()">${x}</button>`).join('')}</div></div></div><div class="card"><h2>Session summary</h2><div style="display:flex;gap:13px;align-items:center;margin:18px 0"><div class="avatar" style="background-image:url('${selectedTherapist.image}')"></div><div><strong>${selectedTherapist.name}</strong><small class="muted" style="display:block">${selectedTherapist.title}</small></div></div><ul class="summary-list"><li><span>Date</span><strong>${selectedDate||'Select a date'}</strong></li><li><span>Time</span><strong>${selectedTime||'Select a time'}</strong></li><li><span>Duration</span><strong>50 minutes</strong></li><li><span>Price</span><strong>${money(selectedTherapist.price)}</strong></li></ul><div class="card" style="background:var(--soft);margin:15px 0">One cancellation and rebooking allowed within 12 hours of your booking.</div><button class="btn primary" style="width:100%" onclick="if(!selectedDate||!selectedTime){toast('Please select a date and time');return}go('confirm')">Continue to Booking →</button></div></div></div>`}
function confirmScreen(){let price=selectedTherapist.price,discount=voucherStatus==='valid'?100:0;return `<div class="page">${header('Payment Options','Choose how you would like to pay for your session.')}<div class="stepper">${['Date & Time','Confirm','Pay'].map((x,i)=>`<div class="step ${i>0?'active':''}"><span>${i+1}</span>${x}</div>${i<2?'<div class="line"></div>':''}`).join('')}</div><div class="booking-layout"><div><div class="card"><h2>Choose payment</h2>${[['carepon','🌿','Pay with Carepon','Secure online payment (Credit/Debit, EFT, Apple Pay)'],['voucher','🎁','Use a Voucher','Enter your voucher code (prepaid session)'],['medical','✚','Medical Aid','Pay after session — we’ll submit the claim on your behalf.']].map(([k,i,t,s])=>`<div class="payment-option ${payment===k?'active':''}" onclick="payment='${k}';render()"><div class="radio"></div><div><strong>${t}</strong><p style="margin:4px 0 0">${s}</p></div><span style="margin-left:auto">${i}</span></div>`).join('')}${payment==='voucher'?`<div class="row"><input class="input" placeholder="Voucher code" value="${voucher}" oninput="voucher=this.value;voucherStatus='';render()"><button class="btn secondary" onclick="validateVoucher()">Apply</button></div>${voucherStatus?`<p style="margin-top:10px;color:${voucherStatus==='valid'?'var(--green)':'var(--coral)'}">${voucherStatus==='valid'?'Voucher applied: R100 discount.':voucherStatus==='invalid'?'Voucher not recognised.':'Voucher unavailable.'}</p>`:''}`:''}</div></div><div class="card"><h2>Booking summary</h2><div style="display:flex;gap:13px;align-items:center;margin:16px 0"><div class="avatar" style="background-image:url('${selectedTherapist.image}')"></div><div><strong>${selectedTherapist.name}</strong><small class="muted" style="display:block">${selectedTherapist.title}</small></div></div><ul class="summary-list"><li><span>Date</span><strong>${selectedDate}</strong></li><li><span>Time</span><strong>${selectedTime}</strong></li><li><span>Duration</span><strong>50 minutes</strong></li><li><span>Subtotal</span><strong>${money(price)}</strong></li>${discount?`<li><span>Voucher</span><strong>−${money(discount)}</strong></li>`:''}<li><span>Total</span><strong>${money(price-discount)}</strong></li></ul><button class="btn primary" style="width:100%;margin-top:18px" onclick="confirmBooking()">Confirm & Pay →</button><button class="btn outline" style="width:100%;margin-top:10px" onclick="go('booking')">Back</button></div></div></div>`}
function session(){return `<div class="page">${header('Your Telehealth Session','Private, supportive space for your session.')}<div class="video-wrap"><div class="video-main"><div><img src="${selectedTherapist.image}" alt="Therapist portrait"><h2 style="color:white;margin-top:16px">${selectedTherapist.name}</h2><p style="color:#e5f0e7">Session in progress · <span id="timer">00:00</span></p></div></div><div class="video-thumb">${camera?'☺':'◼'}</div></div><div class="video-controls"><button class="control ${muted?'active':''}" onclick="muted=!muted;render()" title="Toggle microphone">${muted?'🔇':'🎙'}</button><button class="control ${!camera?'active':''}" onclick="camera=!camera;render()" title="Toggle camera">${camera?'▣':'◻'}</button><button class="control ${chatOpen?'active':''}" onclick="chatOpen=!chatOpen;render()" title="Chat">▤</button><button class="control end" onclick="setModal('End session?','Are you sure you want to end your session?', [{label:'Keep session open',fn:'closeModal()'},{label:'End session',fn:'endSession()',primary:true}])" title="End session">☎</button></div>${chatOpen?`<div class="chat-panel"><h3>Session chat</h3><div class="chat-messages" id="messages">${chat.map(m=>`<div class="msg ${m.mine?'mine':''}">${m.text}</div>`).join('')}</div><div class="row"><input class="input" id="chatInput" placeholder="Write a message..."><button class="btn primary" onclick="sendChat()">Send</button></div></div>`:''}<div class="card" style="margin-top:10px"><small class="muted">This is a simulated telehealth session. No real audio or video connection is made.</small></div></div>`}
function after(){return `<div class="page">${header('After Your Session','')}<div class="card" style="max-width:780px;margin:auto;text-align:center"><div style="font-size:48px;color:var(--green)">✓</div><h1 style="font-size:36px">Session Completed</h1><p>Thank you for your session with ${selectedTherapist.name}.</p><div class="card" style="background:var(--soft);text-align:left;margin:25px 0"><h3>✚ Medical Aid Claim</h3><p>We'll prepare and submit your claim to your medical aid.</p><div class="progress">${['Prepare','Submit','Track'].map((x,i)=>`<div class="progress-step ${i<=claimStatus?'done':''}"><div class="dot">${i<=claimStatus?'✓':i+1}</div><small>${x}</small></div>`).join('')}</div><button class="btn secondary" onclick="claimStatus=Math.min(2,claimStatus+1);persist();toast('Claim status updated');render()">Track claim progress</button></div><button class="btn primary" onclick="go('dashboard')">Go to My Wellness →</button></div></div>`}

function checkin(){return `<div class="page">${header('Vitale Care Check-In','A quick check-in to see how you’re feeling today.')}<div class="card" style="max-width:800px;margin:auto"><h2 style="text-align:center">How are you doing right now?</h2><div class="moods">${[['good','🙂','Good','Green'],['okay','😐','Okay','Amber'],['struggling','🙁','Struggling','Red']].map(([k,f,t,c])=>`<button class="mood ${k} ${mood===k?'active':''}" onclick="mood='${k}';render()"><span class="face">${f}</span><strong>${t}</strong><small style="display:block;margin-top:5px">${c}</small></button>`).join('')}</div>${mood?`<div class="response-panel"><h3>${mood==='good'?'It’s good to notice the positives.':mood==='okay'?'Thanks for checking in.':'Thank you for sharing how you feel.'}</h3><p>${mood==='good'?'A small moment of reflection can help you build on how you’re feeling.':mood==='okay'?'You don’t need to have everything figured out. Take things one step at a time.':'You deserve support. Try to be gentle with yourself in this moment.'}</p></div>`:''}<div class="card" style="background:var(--soft);margin:18px 0"><small>ⓘ Your response helps us support you better. In this prototype, no therapist notification is sent. If you choose Amber or Red, your therapist may be notified in the live service, subject to consent and service settings.</small></div><button class="btn primary" style="width:100%" ${mood?'':'disabled'} onclick="submitMood()">Submit Check-In</button></div></div>`}
function response(){let m=checkins[0]?.mood||mood;return `<div class="page">${header('Check-In Received','')}<div class="card" style="max-width:800px;margin:auto;text-align:center"><div style="font-size:48px;color:var(--green)">✓</div><h1 style="font-size:36px">Well done!</h1><p>${m==='good'?'You’re managing your mental health and emotional well-being. Keep going!':m==='okay'?'You took a moment to check in with yourself. That matters.':'You’ve taken an important step by acknowledging how you feel. You deserve care and support.'}</p><div class="response-panel" style="text-align:left;margin:22px 0"><h3>Helpful next steps</h3><ul style="line-height:1.8">${(m==='good'?['Keep up your wellness routine.','Try a short mindfulness exercise.','Reach out if you need additional support.']:m==='okay'?['Take a few minutes for yourself.','Try a breathing or grounding exercise.','Reach out to someone supportive if it helps.']:['Try a gentle grounding exercise.','Contact someone you trust.','Consider reaching out to your therapist.','If you may be in immediate danger, contact local emergency services or a crisis support service.']).map(x=>`<li>${x}</li>`).join('')}</ul></div><button class="btn primary" onclick="go('dashboard')">Back to My Dashboard →</button></div></div>`}
function secondaryScreen(){let titles={resources:'Wellness Resources',tools:'Mindfulness & Tools',market:'Wellness Marketplace',profile:'Profile',appointments:'My Appointments',progress:'My Progress',claims:'Invoices & Claims'};let title=titles[screen]||'Wellness';let content=screen==='appointments'?booking?`<div class="card"><h3>Upcoming session</h3><p>${booking.therapist} · ${booking.date} · ${booking.time}</p><button class="btn primary" onclick="go('session')">Join simulated session</button></div>`:`<div class="card empty">You have no upcoming appointments. <button class="btn primary" onclick="go('discover')">Find a therapist</button></div>`:screen==='progress'?`<div class="card"><h2>Your check-ins</h2>${checkins.length?checkins.map(x=>`<div class="history-row"><span>${x.date}</span><strong>${x.mood==='good'?'🙂 Good':x.mood==='okay'?'😐 Okay':'🙁 Struggling'}</strong></div>`).join(''):`<p>No check-ins yet. Your progress history will appear here.</p>`}</div>`:screen==='claims'?`<div class="card"><h2>Medical aid & invoices</h2><p>${booking?'Your session claim is being tracked in this prototype.':'Your claims and invoices will appear here.'}</p><div class="progress">${['Prepare','Submit','Track'].map((x,i)=>`<div class="progress-step ${i<=claimStatus?'done':''}"><div class="dot">${i<=claimStatus?'✓':i+1}</div><small>${x}</small></div>`).join('')}</div></div>`:screen==='profile'?`<div class="card"><h2>Riyadh</h2><p>Prototype patient profile</p><button class="btn outline" onclick="resetDemo()">Reset demo journey</button></div>`:`<div class="tiles">${[['🌬️','Breathing','A simple paced breathing practice'],['🧘','Mindfulness','A short grounding exercise'],['📚','Learn','Explore wellbeing guides']].map(([i,t,s])=>`<div class="tile" onclick="setModal('${t}','${s}',[{label:'Close',fn:'closeModal()',primary:true}])"><div class="tile-icon">${i}</div><strong>${t}</strong><small>${s}</small></div>`).join('')}</div>`;return `<div class="page">${header(title,'')}<button class="btn secondary" onclick="go('dashboard')">← Back to dashboard</button><div style="margin-top:18px">${content}</div></div>`}
function render(){topnav();let views={home,discover,profile,booking:bookingScreen,confirm:confirmScreen,session,after,dashboard,checkin,response};app.innerHTML=(views[screen]?views[screen]():secondaryScreen())+(modal?`<div class="modal-backdrop"><div class="modal"><h2>${modal.title}</h2><p>${modal.body}</p><div class="modal-actions">${modal.actions.map(a=>`<button class="btn ${a.primary?'primary':'outline'}" onclick="${a.fn}">${a.label}</button>`).join('')}</div></div></div>`:'');if(screen==='session'&&sessionStarted){startTimer()} }
function validateVoucher(){let c=voucher.trim().toUpperCase();voucherStatus=['VITALE100','CARE2026'].includes(c)?'valid':c==='USED2026'?'used':'invalid';render()}
function confirmBooking(){let amount=selectedTherapist.price-(voucherStatus==='valid'?100:0);if(payment==='voucher'&&voucherStatus!=='valid'){toast('Please apply a valid voucher');return}booking={id:'VW-'+Date.now(),therapist:selectedTherapist.name,date:selectedDate,time:selectedTime,price:amount,payment,status:'confirmed'};persist();sessionStarted=false;setModal('Booking confirmed','Your appointment has been confirmed. This prototype does not process real payments.',[{label:'View session',fn:"closeModal();go('session')",primary:true},{label:'Dashboard',fn:"closeModal();go('dashboard')"}])}
function submitMood(){if(!mood)return;checkins.unshift({date:new Date().toLocaleDateString(),mood,note:''});persist();go('response')}
function endSession(){sessionStarted=false;booking=booking||{};booking.status='completed';persist();closeModal();go('after')}
let timerInterval=null,secs=0;function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{secs++;let el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');},1000)}
function sendChat(){let el=document.getElementById('chatInput');if(el&&el.value.trim()){chat.push({text:el.value.trim(),mine:true});chat.push({text:'Thanks for sharing. We can explore that together.',mine:false});render();let box=document.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}}
function resetDemo(){localStorage.removeItem('vitalePrototype');checkins=[];booking=null;claimStatus=0;selectedDate=null;selectedTime=null;voucher='';voucherStatus='';closeModal();go('home');toast('Demo data reset')}
render();
</script>
